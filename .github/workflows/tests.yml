name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .
      - run: python -m unittest -v tests/test_slide_sync.py
      - run: slide-sync contract --json

  integration:
    # The real engine: ffmpeg-skill (read-only checkout) and ffmpeg from apt.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kajisho5/ffmpeg-skill
          path: ffmpeg-skill
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - run: pip install -e .
      - name: Integration tests run (not skipped)
        env:
          FFMPEG_SKILL_DIR: ${{ github.workspace }}/ffmpeg-skill
        run: |
          set -o pipefail
          python -m unittest -v tests/test_slide_sync.py 2>&1 | tee test.log
          ! grep -q "skipped 'needs ffmpeg-skill and ffmpeg'" test.log
      - name: doctor
        env:
          FFMPEG_SKILL_DIR: ${{ github.workspace }}/ffmpeg-skill
        run: slide-sync doctor --json
