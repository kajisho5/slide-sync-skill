[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slide-sync-skill"
version = "0.1.0"
description = "Slide changes in a talk recording, as a slide timeline and chapters. Detection and chapter writing run on ffmpeg-skill; local, no network."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "kajisho5"}]
keywords = ["slides", "chapters", "lecture", "conference", "recording", "scene-detection", "agent-skill", "video-production"]
dependencies = []

[project.scripts]
slide-sync = "slide_sync.cli:main"

[project.urls]
Repository = "https://github.com/kajisho5/slide-sync-skill"

[tool.setuptools.packages.find]
where = ["src"]
